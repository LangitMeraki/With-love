      function syncCallClock() {
        if (SCENE_MODE && !sceneReady()) return;
        const match = callEvent()?.time?.match(/^(\d{1,2}):(\d{2}) ([AP]M)$/);
        if (!match) return;
        storyClockAuthored = true;
        storyMinute =
          ((+match[1] % 12) + (match[3] === "PM" ? 12 : 0)) * 60 + +match[2];
        storyClockStart = storyMinute;
        storyClockBase = elapsed();
        $("#sbt").textContent = deviceClock();
        const lockTime = $("#lkt");
        if (lockTime) lockTime.textContent = deviceClock();
        saveDeviceState(false);
      }
      function callTimestamp() {
        const event = callEvent();
        const clock = event?.time?.match(/^(\d{1,2}):(\d{2}) ([AP]M)$/);
        const minute = clock
          ? ((+clock[1] % 12) + (clock[3] === "PM" ? 12 : 0)) * 60 + +clock[2]
          : nowMin();
        return (
          (event?.date || "오늘") +
          " " +
          Math.floor(minute / 60) +
          ":" +
          pad(minute % 60)
        );
      }

        clearInterval(ringIv);

      function wireSlider() {

        const reset = () => {
          input.value = "0";
          update();
        };
        input.addEventListener("input", update);

          if (callState === "ring" && Number(input.value) >= 75) answerCall();
          else reset();
        });
        input.addEventListener("pointercancel", reset);
        input.addEventListener("keydown", (e) => {

          }
        });

      /* Hanni 전화를 거절/놓쳤을 때: 카톡으로 다시 걸어달라고 하고, 90초 뒤 다시 걸어옴 */
      function afterDecline() {

          return;

        const sceneScript =

            ? sceneCallScript()

                note.app === "kakao" &&
                note.contact === message.contact &&

            )
          )

              app: "kakao",
              contact: message.contact,

        });
        VIEWS.linefriends = () => ({
          cls: "line line-root",
          html:
            lineHeader("linefriends") +
            `<div class="scroll">${lineFriends()}</div>` +
            lineTabs(),
        });
        VIEWS.linehome = () => ({
          cls: "line line-root",
          html:
            `<header class="line-page-header"><h1>Home</h1><button onclick="push('settings')" aria-label="Settings">${G.gear}</button></header><div class="scroll">${lineFriends()}</div>` +
            lineTabs("linehome"),
        });
        VIEWS.linealbums = () => ({
          cls: "line",
          html:
            navHTML({ title: "Shared photos", back: "Chats", solid: true }) +
            `<div class="scroll"><div class="line-photo-grid">${
              lineSharedPhotos()
                .map(
                  (src) =>
                    `<button onclick="openViewerSrc(${esc(JSON.stringify(src))},this.firstElementChild)">${readerImageHTML(`src="${esc(assetURL(src))}" alt="Shared photo" loading="lazy"`)}</button>`,
                )
                .join("") || '<p class="line-empty">No shared photos yet.</p>'
            }</div></div>`,
        });
        VIEWS.linevoom = () => ({
          cls: "line line-root",
          html:
            '<header class="line-page-header"><h1>VOOM</h1></header><div class="scroll"><div class="line-empty-state"><h2>No posts yet</h2><p>There are no VOOM posts to show.</p></div></div>' +
            lineTabs("linevoom"),
        });
        VIEWS.linenews = () => ({
          cls: "line line-root",
          html:
            '<header class="line-page-header"><h1>News</h1></header><div class="scroll">' +
            SAFARI_READS.map(
              (article) =>
                `<button class="line-news" onclick="openSafariRead(${esc(JSON.stringify(article.id))})"><small>${esc(article.source)}</small><b>${esc(article.title)}</b><p>${esc(article.deck)}</p></button>`,
            ).join("") +
            (SAFARI_READS.length
              ? ""
              : '<p class="line-empty">No news to show.</p>') +
            "</div>" +
            lineTabs("linenews"),
        });
        VIEWS.linewallet = () => ({
          cls: "line line-root",
          html:
            '<header class="line-page-header"><h1>Wallet</h1></header><div class="scroll"><div class="line-empty-state">' +
            G.bag +
            "<h2>No cards or passes</h2><p>Your wallet is empty.</p></div></div>" +
            lineTabs("linewallet"),
        });
      }

      /* Messages presentation; rooms, media and story playback remain shared. */
      let imessageFilter = "all";
      function imessageChatRow(name, last, time, count) {
        if (imessageFilter === "unread" && !count) return "";
        return `<button class="crow im-row" data-contact="${esc(name)}" onclick="chatId=${esc(JSON.stringify(name))};push('chat')" aria-label="${esc(dn(name))}${count ? `, ${count} unread messages` : ""}"><span class="im-unread ${count ? "on" : ""}" aria-hidden="true"></span><span class="av">${avatarFor(name, isGroup(name))}</span><span class="im-row-copy"><span class="im-row-heading"><b>${esc(dn(name))}</b><time>${esc(time)}</time>${G.chevR}</span><span class="im-preview">${last ? esc(previewText(last[0], isGroup(name))) : ""}</span></span></button>`;
      }
      function imessageFilters() {
        sheetAU(
          "Filter Messages",
          `<button class="row tap" onclick="setIMessageFilter('all')" aria-pressed="${imessageFilter === "all"}">${G.chat}<span>All Messages</span>${imessageFilter === "all" ? "✓" : ""}</button><button class="row tap" onclick="setIMessageFilter('unread')" aria-pressed="${imessageFilter === "unread"}">${G.bell}<span>Unread</span>${imessageFilter === "unread" ? "✓" : ""}</button>`,
        );
      }
      function setIMessageFilter(filter) {
        if (!["all", "unread"].includes(filter)) return;
        imessageFilter = filter;
        closeSheet();
        show("kakao");
      }
      function imessageEdit() {
        sheetAU(
          "Messages",
          `<button class="row tap" onclick="imessageMarkAllRead()">${G.chat}<span>Mark all as read</span></button><button class="row tap" onclick="closeSheet();push('journal')">${G.book}<span>Story journal</span></button>`,
        );
      }
      function imessageMarkAllRead() {
        for (const name of chatNames) unread[name] = 0;
        hanniUnread = 0;
        saveDeviceState();
        renderHome();
        closeSheet();
        show("kakao");
      }
      function imessageChatHeader() {
        return `<div class="chat-h"><button class="bk" onclick="back()" aria-label="Back to messages">${G.chevL}</button><button class="im-contact" onclick="imessageInfo()" aria-label="Conversation details for ${esc(dn(chatId))}"><span class="im-contact-avatar">${avatarFor(chatId, isGroup(chatId))}</span><span class="im-contact-name"><span class="nm">${esc(dn(chatId))}</span>${G.chevR}</span></button><span></span></div>`;
      }
      function imessageSharedPhotos() {
        return [
          ...new Set(
            chatItems(chatId)
              .filter((item) => mediaLabels[item.text]?.kind === "image")
              .map((item) => mediaLabels[item.text].src),
          ),
        ];
      }
      function imessageInfo() {
        closeKbd();
        const photos = imessageSharedPhotos();
        sheetAU(
          dn(chatId),
          `${isGroup(chatId) ? `<p>${MEMBERS[chatId]} members</p>` : ""}${SCENE_MODE || chatId === "Hanni" ? `<button class="row tap" onclick="closeSheet();dial(${esc(JSON.stringify(chatId))})">${G.handset}<span>Call</span></button>` : ""}<button class="row tap" onclick="closeSheet();showSearch(chatId)">${G.search}<span>Search conversation</span></button><button class="row tap" onclick="imessageToggleTimes()">${G.clock}<span>Show or hide message times</span></button><button class="row tap" onclick="closeSheet();push('journal')">${G.book}<span>Story journal</span></button>${photos.length ? `<h3>Photos</h3><div class="im-media-grid">${photos.map((src) => `<button onclick="closeSheet();openViewerSrc(${esc(JSON.stringify(src))})" aria-label="Open shared photo">${readerImageHTML(`src="${esc(assetURL(src))}" alt="Shared photo" loading="lazy"`)}</button>`).join("")}</div>` : ""}`,
        );
      }
      function imessageToggleTimes() {
        closeSheet();
        [...APP.children]
          .find((page) => !page.inert)
          ?.classList.toggle("im-show-times");
      }
      function imessageAttachments() {
        closeKbd();
        sheetAU(
          "Add to message",
          `<button class="row tap" onclick="closeSheet();push('camera')">${G.camera}<span>Camera</span></button><button class="row tap" onclick="closeSheet();push('photos')">${G.photo}<span>Photos</span></button>`,
        );
      }
      function imessageComposer() {
        return `<div class="cin safe im-composer" id="cin"><button class="im-add" onclick="imessageAttachments()" aria-label="Attachments">${G.plus}</button><div class="im-input"><button class="fld ph" id="fld" onclick="tapInput()" aria-label="Type a message">iMessage</button><button class="snd" id="snd" onclick="sendLine()" aria-label="Send message">${G.arrowUp}</button></div></div><div class="kbd" id="kbd">${kbdHTML()}</div>`;
      }
      function imessageMessage(message, index, first, last, group, start) {
        const me = message.who === "me";
        return `${start ? `<div class="im-time-separator">iMessage<br>${esc(message.time)}</div>` : ""}<div data-chat-index="${index}" class="ln ${me ? "me" : "th"} ${first ? "first" : ""} ${last ? "im-last" : ""} ${group ? "im-group" : ""}">${!me && group && first ? `<span class="im-group-avatar">${avatarFor(message.sender)}</span>` : ""}<div class="im-bubble">${!me && group && first ? `<div class="who">${esc(dn(message.sender))}</div>` : ""}${bubble(message.text)}<time class="im-time">${esc(message.time)}</time>${me && last ? `<span class="im-receipt">${message.rd ? "Delivered" : "Read"}</span>` : ""}</div></div>`;
      }
      if (IMESSAGE) {
        VIEWS.kakao = () => ({
          cls: "kk imessage im-list",
          html: `<header class="im-header"><div class="im-top-controls"><button onclick="imessageEdit()">Edit</button><button onclick="imessageFilters()" aria-label="Filter messages" ${imessageFilter === "unread" ? 'aria-pressed="true"' : ""}>${G.menu}</button></div><h1>${imessageFilter === "unread" ? "Unread" : "Messages"}</h1></header><div class="scroll">${chatListRows()}</div><div class="im-list-toolbar"><button class="im-search" onclick="showSearch('','chat')" aria-label="Search messages">${G.search}<span>Search</span></button><button class="im-compose" onclick="chatContacts()" aria-label="New message">${G.compose}</button></div>`,
        });
      }

      // Device appearance persists independently from authored stories and playthroughs.
      const APPEARANCE_KEY = "au-phone-appearance-v1";
      let phoneAppearance = { intensity: 45, reduceTransparency: false };
      try {
        const raw = localStorage.getItem(APPEARANCE_KEY);
        if (raw && raw.length < 500) {
          const saved = JSON.parse(raw);
          if (
            saved &&
            Number.isInteger(saved.intensity) &&
            saved.intensity >= 0 &&
            saved.intensity <= 100 &&
            typeof saved.reduceTransparency === "boolean"
          )
            phoneAppearance = {
              intensity: saved.intensity,
              reduceTransparency: saved.reduceTransparency,
            };
        }
      } catch {}
      function applyPhoneAppearance() {
        const phone = $("#phone");
        phone.dataset.font = STORY.device.font || "default";
        phone.style.setProperty(
          "--glass-alpha",
          String(0.36 + phoneAppearance.intensity * 0.0062),
        );
        phone.dataset.reduceTransparency = String(
          phoneAppearance.reduceTransparency,
        );
        const output = $("#glass-intensity-value");
        if (output) output.textContent = phoneAppearance.intensity + "%";
      }
      function setPhoneTheme(mode) {
        if (mode !== "light" && mode !== "dark") return;
        phoneDark = mode === "dark";
        $("#phone").dataset.appearance = mode;
        for (const page of APP.children) {
          page.classList.toggle(
            "dark",
            phoneDark || page.dataset.nativeDarkClass === "1",
          );
          page.dataset.dark =
            phoneDark || page.dataset.nativeDark === "1" ? "1" : "";
        }
        document
          .querySelectorAll('input[name="phone-theme"]')
          .forEach((input) => {
            input.checked = input.value === mode;
          });
        setStatus(viewDark());
        try {
          localStorage.setItem(PHONE_THEME_KEY, mode);
        } catch {
          toastAU(
            "Appearance updated. This browser could not save your preference.",
          );
        }
      }
      function phoneThemeOptions() {
        return `<fieldset class="phone-theme-options"><legend>Color mode</legend>${["light", "dark"].map((mode) => `<label><span class="phone-theme-sample ${mode}" aria-hidden="true"><i></i><i></i><i></i></span><span><input type="radio" name="phone-theme" value="${mode}" ${phoneDark === (mode === "dark") ? "checked" : ""} onchange="setPhoneTheme(this.value)">${mode === "dark" ? "Dark" : "Light"}</span></label>`).join("")}</fieldset><p class="settings-footnote">Your choice is saved for this story on this browser.</p>`;
      }
      function setGlassIntensity(value) {
        const intensity = Number(value);
        if (!Number.isInteger(intensity) || intensity < 0 || intensity > 100)
          return;
        phoneAppearance.intensity = intensity;
        applyPhoneAppearance();
        savePhoneAppearance();
      }
      function setReducedTransparency() {
        phoneAppearance.reduceTransparency =
          !phoneAppearance.reduceTransparency;
        applyPhoneAppearance();
        savePhoneAppearance();
        show("appearance");
      }
      function savePhoneAppearance() {
        try {
          localStorage.setItem(APPEARANCE_KEY, JSON.stringify(phoneAppearance));
        } catch {
          toastAU(
            "Appearance updated. This browser could not save your preference.",
          );
        }
      }
      PARENT.appearance = "settings";
      const settingsBeforeAppearance = VIEWS.settings;
      VIEWS.settings = () => {
        const page = settingsBeforeAppearance();
        const end = page.html.lastIndexOf("</div>");
        page.html =
          page.html.slice(0, end) +
          `<div class="group settings-section"><button class="row tap" style="width:100%;text-align:left" onclick="push('appearance')">${sIc("#5856d6", "sun")}<span style="flex:1">Appearance</span>${G.chevR}</button></div>` +
          page.html.slice(end);
        return page;
      };
      VIEWS.appearance = () => ({
        cls: "grouped",
        html:
          navHTML({ title: "Appearance", back: t("app_settings") }) +
          `<div class="scroll"><h1 class="lt">Appearance</h1>${phoneThemeOptions()}<div class="appearance-hero"><div class="appearance-sample" aria-hidden="true"><span>${G.home}</span><span>${G.search}</span><span>${G.heart}</span></div><h2>Liquid Glass</h2><p>Light, depth, and a little of what’s underneath.</p></div><div class="group"><label class="appearance-slider" for="glass-intensity"><span>Glass appearance <output id="glass-intensity-value" for="glass-intensity">${phoneAppearance.intensity}%</output></span><input id="glass-intensity" type="range" min="0" max="100" step="1" value="${phoneAppearance.intensity}" oninput="setGlassIntensity(this.value)"><small><span>Clear</span><span>Tinted</span></small></label></div><p class="settings-footnote">Choose how much background shows through buttons, navigation, and floating controls.</p><div class="group"><div class="row"><span style="flex:1">Reduce Transparency</span><button class="sw ${phoneAppearance.reduceTransparency ? "on" : ""}" role="switch" aria-checked="${phoneAppearance.reduceTransparency}" aria-label="Reduce Transparency" onclick="setReducedTransparency()"></button></div></div><p class="settings-footnote">Use more solid surfaces for easier reading. Your device’s accessibility preferences also apply.</p></div>`,
      });
      applyPhoneAppearance();

      // Unified Phone layout: contact details and call actions are separate targets.
      let phoneQuery = "";
      const phoneContactName = (value) => value.replace(/ \(\d+\)$/, "");
      const phoneNameArg = (value) =>
        esc(JSON.stringify(phoneContactName(value)));
      function phoneRecords() {
        return [...extraCalls, ...calls];
      }
      function phoneRecordRows(records) {
        return (
          records
            .map((c) => {
              const name = phoneContactName(c[0]),
                missed = c[2] === "부재중",
                outgoing = c[2] === "발신";
              return `<div class="phone-record ${missed ? "missed" : ""}"><button class="phone-record-contact" onclick="phoneContactInfo(${phoneNameArg(c[0])})" aria-label="Contact details for ${esc(dn(name))}"><span class="phone-avatar">${avatarFor(name, isGroup(name))}</span><span class="phone-record-copy"><b>${esc(callNameDisp(c[0]))}</b><small>${outgoing ? G.arrowUp : G.handset}${missed ? "Missed call" : outgoing ? "Outgoing" : t("mobile")}</small></span><time>${esc(callWhen(c[1]))}</time></button><button class="phone-record-call" onclick="dial(${phoneNameArg(c[0])})" aria-label="Call ${esc(dn(name))}">${G.handset}</button></div>`;
            })
            .join("") || '<p class="phone-empty">No calls</p>'
        );
      }
      function phoneContactInfo(name) {
        if (typeof name !== "string") return;
        sheetAU(
          dn(name),
          `<div class="phone-contact-card"><span class="phone-avatar">${avatarFor(name, isGroup(name))}</span><h3>${esc(dn(name))}</h3><p>${t("mobile")}</p><button onclick="closeSheet();dial(${phoneNameArg(name)})" class="phone-contact-call">${G.handset}<span>Call</span></button></div>`,
        );
      }
      function phoneFilters() {
        sheetAU(
          "Filter calls",
          `<div class="phone-filter-layout"><span>Unified</span><small>Favorites, calls, and voicemail</small></div><button class="row tap" onclick="missOnly=false;closeSheet();show('phone')" aria-pressed="${!missOnly}">All calls ${!missOnly ? "✓" : ""}</button><button class="row tap" onclick="missOnly=true;closeSheet();show('phone')" aria-pressed="${missOnly}">Missed ${missOnly ? "✓" : ""}</button><button class="row tap" onclick="closeSheet();show('phonevoicemail')">Voicemails</button>`,
        );
      }
      const favoritePhoneContacts = () =>
        chatNames.filter((name) => !isGroup(name)).slice(0, 4);
      VIEWS.phone = () => ({
        cls: "phone-app",
        html:
          navHTML({
            title: "Calls",
            right: `<button onclick="phoneFilters()" aria-label="Filter calls">${G.filter}</button>`,
          }) +
          `<div class="scroll"><h1 class="lt">${missOnly ? "Missed" : "Calls"}</h1><section class="phone-favorites"><header><h2>Favorites</h2><button onclick="show('phonefavorites')">Show All</button></header><div class="phone-favorite-grid">${favoritePhoneContacts()
            .map(
              (name) =>
                `<button onclick="dial(${phoneNameArg(name)})" aria-label="Call ${esc(dn(name))}"><span class="phone-avatar">${avatarFor(name)}</span><b>${esc(dn(name))}</b><small>${G.handset}${t("mobile")}</small></button>`,
            )
            .join(
              "",
            )}</div></section><h2 class="phone-section-heading">Recents</h2><div class="phone-records">${phoneRecordRows(phoneRecords().filter((c) => !missOnly || c[2] === "부재중"))}</div></div>` +
          phoneTabs(1),
      });
      VIEWS.phonefavorites = () => ({
        cls: "phone-app",
        html:
          navHTML({
            title: "Favorites",
            back: "Calls",
            backFn: "show('phone')",
          }) +
          `<div class="scroll"><h1 class="lt">Favorites</h1>${contactRows(chatNames.filter((name) => !isGroup(name)))}</div>` +
          phoneTabs(0),
      });
      VIEWS.phonecontacts = () => ({
        cls: "phone-app",
        html:
          navHTML({ title: "Contacts" }) +
          `<div class="scroll"><h1 class="lt">Contacts</h1><button class="phone-my-card" onclick="phoneContactInfo('Minji')"><span class="phone-avatar">${avatarFor("Minji")}</span><span><b>${esc(STORY.characters.owner.name)}</b><small>My Card</small></span>${G.chevR}</button>${chatNames
            .filter((name) => !isGroup(name))
            .map(
              (name) =>
                `<button class="device-contact" onclick="phoneContactInfo(${phoneNameArg(name)})"><span class="av">${avatarFor(name)}</span><span>${esc(dn(name))}</span>${G.chevR}</button>`,
            )
            .join("")}</div>` +
          phoneTabs(2),
      });
      function phoneSearchResults() {
        const query = phoneQuery.trim().toLocaleLowerCase();
        if (!query)
          return '<p class="phone-empty">Search your contacts and call history</p>';
        const matches = (name) =>
            dn(phoneContactName(name)).toLocaleLowerCase().includes(query),
          contacts = chatNames.filter(matches),
          records = phoneRecords().filter((call) => matches(call[0]));
        return `${contacts.length ? `<h2 class="phone-section-heading">Contacts</h2>${contacts.map((name) => `<button class="device-contact" onclick="phoneContactInfo(${phoneNameArg(name)})"><span class="av">${avatarFor(name, isGroup(name))}</span><span>${esc(dn(name))}</span>${G.chevR}</button>`).join("")}` : ""}${records.length ? `<h2 class="phone-section-heading">Calls</h2>${phoneRecordRows(records)}` : ""}${!contacts.length && !records.length ? '<p class="phone-empty">No results</p>' : ""}`;
      }
      function searchPhone(value) {
        phoneQuery = String(value).slice(0, 100);
        const results = $("#phone-search-results");
        if (results) results.innerHTML = phoneSearchResults();
      }
      PARENT.phonesearch = "phone";
      VIEWS.phonesearch = () => ({
        cls: "phone-app",
        html:
          navHTML({ title: "Search", back: "Calls", backFn: "show('phone')" }) +
          `<div class="scroll"><h1 class="lt">Search</h1><label class="phone-search-field">${G.search}<input type="search" aria-label="Search calls and contacts" placeholder="Search" value="${esc(phoneQuery)}" oninput="searchPhone(this.value)"></label><div id="phone-search-results">${phoneSearchResults()}</div></div>` +
          phoneTabs(1),
        init: (pg) => pg.querySelector("input")?.focus(),
      });

      addEventListener("resize", fit);
      fit();
      renderLock();
      renderHome();
      setStatus(true);
      setInterval(tick, 250);
      tick();
    </script>
  </body>
  <!-- Cleaned and refreshed for Adrianne Stacee -->
</html>
